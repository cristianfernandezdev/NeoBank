version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: neobank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neobank_admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: neobank_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: