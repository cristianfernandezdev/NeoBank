spring:
  application:
    name: neobank-core

  datasource:
    url: jdbc:h2:mem:neobank_core
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      # Como la base de datos se borra al apagar, dejamos que Spring cree las tablas por hoy
      ddl-auto: create-drop